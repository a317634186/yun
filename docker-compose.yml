services:
  alist:
    image: xhofe/alist-aria2:latest   # AList 官方 + Aria2 一体镜像（内置高速下载配置）
    container_name: alist
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PUID=0
      - PGID=0
      - UMASK=022
    volumes:
      - ./data:/opt/alist/data        # AList 数据（配置数据库）
      - ./downloads:/root/Download    # 离线下载目录（aria2 默认下载路径）
    expose:
      - "5244"                        # 仅内部访问，由前端容器反代

  caster:
    build: ./caster                   # python + ffmpeg：探测、转码、字幕、鉴权、清理
    container_name: yun-caster
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - ALIST_URL=http://alist:5244
      - MEDIA_ROOT=/media
      - CACHE_DIR=/cache
      - MOUNT_PREFIX=/downloads
      - STREAM_SECRET=${STREAM_SECRET:-}
      # —— 下载：直连 aria2，绕开 AList「临时目录 + 转存」两段式 ——
      - ARIA2_URL=${ARIA2_URL:-http://alist:6800/jsonrpc}
      - ARIA2_SECRET=${ARIA2_SECRET:-}
      - ARIA2_DIR=${ARIA2_DIR:-/root/Download}   # aria2 容器内看到的下载目录
      - SEED_TIME=${SEED_TIME:-0}                # 0 = 下完不做种，任务才会真正结束
      - BT_PRIORITIZE_PIECE=${BT_PRIORITIZE_PIECE:-head=32M,tail=32M}
      # —— 播放质量与算力 ——
      - MAX_HEIGHT=${MAX_HEIGHT:-720}            # 转码高度上限，VPS 越弱就调越低（480）
      - VIDEO_QUALITY=${VIDEO_QUALITY:-23}       # 画质，数字越小越清晰越吃 CPU（18-28）
      - X264_PRESET=${X264_PRESET:-veryfast}
      - VIDEO_ENCODER=${VIDEO_ENCODER:-libx264}  # 有硬件编码时可换 h264_nvenc / h264_qsv / h264_vaapi
      - HWACCEL=${HWACCEL:-none}                 # 硬件解码：none / auto / vaapi / qsv / cuda
      - TRANSCODE_JOBS=${TRANSCODE_JOBS:-2}      # 同时跑几个 ffmpeg，建议 = CPU 核数
      - SEG_SECONDS=${SEG_SECONDS:-6}
      - PREWARM_SEGMENTS=${PREWARM_SEGMENTS:-3}
      # —— 清理策略 ——
      - RETENTION_HOURS=${RETENTION_HOURS:-1}    # 下载文件保留小时数，0 = 永不自动删
      - KEEP_PLAYING_PROTECT=${KEEP_PLAYING_PROTECT:-1}  # 0 = 到点就删，不管在不在看
      - MAX_DISK_PERCENT=${MAX_DISK_PERCENT:-90} # 磁盘超过此占用率就先删最旧的
      - CACHE_MAX_MB=${CACHE_MAX_MB:-4096}       # 转码分片缓存上限
      - CLEAN_INTERVAL=${CLEAN_INTERVAL:-300}
      # —— 鉴权 ——
      - AUTH_ENFORCE=${AUTH_ENFORCE:-1}          # 0 = 关闭直链鉴权（不建议）
    volumes:
      - ./downloads:/media            # 需要可写：过期清理在这里执行
      - ./cache:/cache                # 转码分片缓存
    expose:
      - "8000"
    depends_on:
      - alist

  web:
    image: nginx:alpine                # 播放器前端页面 + 反向代理
    container_name: yun-web
    restart: always
    ports:
      - "${PORT:-5244}:80"            # 对外端口在 .env 的 PORT 中修改
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./downloads:/srv/downloads:ro
    depends_on:
      - alist
      - caster

services:
  alist:
    image: xhofe/alist-aria2:latest   # AList 官方 + Aria2 一体镜像（内置高速下载配置）
    container_name: alist
    restart: always
    ports:
      - "${PORT:-5244}:5244"          # 对外端口在 .env 的 PORT 中修改
    environment:
      - TZ=Asia/Shanghai
      - PUID=0
      - PGID=0
      - UMASK=022
    volumes:
      - ./data:/opt/alist/data        # AList 数据（配置数据库、云盘挂载记录）
      - ./downloads:/root/Download    # 离线下载目录（aria2 默认下载路径）

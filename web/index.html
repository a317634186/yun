<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>yun · 云播放器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e1420;color:#dbe4f0;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#121a2a;border-bottom:1px solid #1f2a3f}
.logo{font-size:18px;font-weight:700}.logo span{color:#4f8cff}
main{max-width:960px;margin:0 auto;padding:20px 16px 60px}
.card{background:#151d2e;border:1px solid #1f2a3f;border-radius:12px;padding:20px}
.hidden{display:none!important}
#login-view{max-width:360px;margin:10vh auto 0}
#login-view h2{font-size:16px;margin-bottom:14px;font-weight:600}
input,button{font:inherit}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a3852;background:#0e1420;color:#dbe4f0;outline:none}
input:focus{border-color:#4f8cff}
button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;background:#243350;color:#dbe4f0}
button:hover{background:#2d4166}
button.primary{background:#4f8cff;color:#fff}button.primary:hover{background:#6ba1ff}
button.mini{padding:4px 10px;font-size:12px;border-radius:6px}
button.play-btn{background:#1a6b2a;color:#fff;padding:5px 14px;font-size:12px;border-radius:6px;white-space:nowrap}
button.play-btn:hover{background:#22883a}
button.folder-btn{background:#243350;color:#8ea2c4;padding:5px 10px;font-size:12px;border-radius:6px;white-space:nowrap}
button.folder-btn:hover{background:#2d4166}
button.folder-btn.open{background:#2a4a6b;color:#4f8cff}
button.del-btn{background:#3a1a1a;color:#ff7a7a;padding:5px 10px;font-size:12px;border-radius:6px;white-space:nowrap}
button.del-btn:hover{background:#5a2020}
.timer-bar{font-size:11px;color:#7c8dab;margin-top:4px}
.err{color:#ff7a7a;font-size:13px;margin-top:10px;min-height:18px}
.inputrow{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.inputrow input{flex:1;min-width:200px}
.autolabel{display:flex;align-items:center;gap:6px;color:#8ea2c4;font-size:13px;white-space:nowrap;cursor:pointer}
.playerbox{background:#000;border-radius:12px;overflow:hidden;border:1px solid #1f2a3f}
.playerbox video{width:100%;aspect-ratio:16/9;display:block;background:#000}
.ptip{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;color:#5a6b8c;flex-direction:column;gap:8px}
.ptip .big{font-size:40px}
.tabs{display:flex;gap:8px;margin:18px 0 12px}
.tabs button{background:transparent;color:#8ea2c4;padding:6px 14px}
.tabs button.active{background:#243350;color:#fff}
.task{border:1px solid #1f2a3f;border-radius:10px;margin-bottom:10px;overflow:hidden;background:#151d2e}
.task-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:default}
.task-head .ico{width:22px;text-align:center;flex-shrink:0}
.task-head .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.task-head .bar-wrap{width:120px;flex-shrink:0}
.task-head .bar{height:6px;border-radius:3px;background:#1f2a3f;overflow:hidden}
.task-head .bar i{display:block;height:100%;background:#4f8cff;border-radius:3px;transition:width .5s}
.task-head .pct{color:#7c8dab;font-size:12px;width:44px;text-align:right;flex-shrink:0}
.task-head .acts{display:flex;gap:6px;flex-shrink:0}
.task-files{border-top:1px solid #1f2a3f;padding:8px 14px 10px}
.file-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.file-row .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#c0cad8}
.file-row .fsize{color:#7c8dab;font-size:12px;flex-shrink:0}
.file-row .fstatus{color:#7c8dab;font-size:11px;flex-shrink:0;max-width:80px;text-align:right}
.empty{color:#5a6b8c;text-align:center;padding:26px 0;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:#243350;border:1px solid #33456b;color:#dbe4f0;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.now-playing{color:#4f8cff;font-size:11px;margin-left:6px}
.task-err{padding:8px 14px;border-top:1px solid #1f2a3f;color:#ff9b9b;font-size:12px;line-height:1.5;background:#1e1418}
.task-err.warn{color:#e0b155;background:#1c1810}
.stage{display:inline-block;background:#243350;color:#8ea2c4;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:6px}
.banner{margin:14px 0;padding:10px 14px;border-radius:10px;background:#2a1c1c;border:1px solid #5a2020;color:#ff9b9b;font-size:13px;line-height:1.6}
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:#121a2a;border-top:1px solid #1f2a3f;font-size:12px;color:#8ea2c4}
.pbar label{display:flex;align-items:center;gap:5px}
.pbar .badge{padding:3px 8px;border-radius:6px;background:#243350;color:#9fb6dc;white-space:nowrap}
.pbar .badge.direct{background:#12331c;color:#5fc27e}
.pbar .badge.hls{background:#3a2d10;color:#e0b155}
.pbar select{background:#0e1420;color:#dbe4f0;border:1px solid #2a3852;border-radius:6px;padding:4px 6px;font:inherit;max-width:190px}
.pbar .grow{flex:1;min-width:0}
.pbar .note{color:#7c8dab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loading{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;color:#8ea2c4;flex-direction:column;gap:12px}
.spin{width:26px;height:26px;border:3px solid #2a3852;border-top-color:#4f8cff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
video::cue{font-size:20px;background:rgba(0,0,0,.55);text-shadow:0 1px 2px #000}
</style>
</head>
<body>
<header>
  <div class="logo">☁ <span>yun</span> 云播放器</div>
  <div id="userbar" class="meta" style="color:#7c8dab"></div>
</header>
<main>
  <section id="login-view" class="card hidden">
    <h2>登录</h2>
    <div style="margin-bottom:12px"><input type="text" id="in-user" value="admin" placeholder="用户名"></div>
    <div style="margin-bottom:14px"><input type="password" id="in-pass" placeholder="密码（安装时屏幕显示的密码）"></div>
    <button class="primary" style="width:100%" id="btn-login">登 录</button>
    <div class="err" id="login-err"></div>
  </section>
  <section id="app-view" class="hidden">
    <div class="inputrow">
      <input type="text" id="in-magnet" placeholder="粘贴磁力链接（magnet:?xt=...）">
      <button class="primary" id="btn-add">添加下载</button>
      <label class="autolabel"><input type="checkbox" id="chk-auto" checked>完成自动播放</label>
    </div>
    <div class="playerbox">
      <video id="video" controls preload="metadata" playsinline class="hidden"></video>
      <div class="loading hidden" id="player-loading"><div class="spin"></div><div id="loading-text">正在准备…</div></div>
      <div class="ptip" id="player-tip"><div class="big">🎬</div><div>添加磁力链接开始下载，下载中即可点击播放</div></div>
      <div class="pbar hidden" id="pbar">
        <span class="badge" id="mode-badge"></span>
        <span class="note grow" id="mode-note"></span>
        <label id="wrap-quality" class="hidden">清晰度<select id="sel-quality"></select></label>
        <label id="wrap-audio" class="hidden">音轨<select id="sel-audio"></select></label>
        <label id="wrap-sub" class="hidden">字幕<select id="sel-sub"></select></label>
      </div>
    </div>
    <div class="tabs">
      <button data-tab="tasks" class="active">下载列表</button>
      <button data-tab="history">播放记录</button>
    </div>
    <div id="tasks-view">
      <div id="task-list"></div>
    </div>
    <div id="history-view" class="hidden">
      <div id="history-list"></div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
'use strict';
var DL = '/downloads';
// 尽量把常见容器都认出来；认不出来的文件不会出现在列表里，所以宁可宽一点
var VIDEO_RE = /\.(mp4|m4v|mkv|webm|avi|mov|ts|mts|m2ts|flv|f4v|wmv|asf|mpg|mpeg|mpv|rmvb|rm|3gp|3g2|ogv|ogm|vob|divx|mxf)$/i;
var token = localStorage.getItem('yun_token') || '';
var auth = null;
try { auth = JSON.parse(localStorage.getItem('yun_auth') || 'null'); } catch(e){}
var hist = {};
try { hist = JSON.parse(localStorage.getItem('yun_hist') || '{}'); } catch(e){}
var taskMap = {};        // taskID -> task info
var taskFiles = {};      // taskID -> [ {name, path, size} ] (cached video files)
var knownVideos = {};    // path -> 1 (for auto-play detection)
var currentPlayPath = '';

function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function fmtSize(n){ n=+n||0; if(n<1024) return n+'B'; var u=['KB','MB','GB','TB'],i=-1; do{n/=1024;i++}while(n>=1024&&i<3); return n.toFixed(1)+u[i]; }
function fmtTime(s){ s=Math.floor(+s||0); var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return (h?h+':':'')+(h&&m<10?'0':'')+m+':'+(x<10?'0':'')+x; }
function fmtDate(ts){ var d=new Date(ts); return (d.getMonth()+1)+'-'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fileDate(f){ var m=f&&f.modified; if(!m) return new Date(); if(typeof m==='number') return new Date(m*1000); var d=new Date(m); return isNaN(+d)?new Date():d; }
var srvCfg = {retention_hours: 1};   // 由 /stream/health 下发，清理策略以服务端为准
function remainText(f){
  var rh = +srvCfg.retention_hours || 0;
  if (rh <= 0) return '长期保留';
  var remain = Math.round(rh*60 - (Date.now()-fileDate(f))/60000);
  if (remain <= 1) return '即将清理';
  return '⏳剩'+remain+'分';
}
var toastTimer;
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show')},2500); }

/* ===== API ===== */
function api(path, body, retry){
  var opt = {method: body ? 'POST' : 'GET', headers:{'Content-Type':'application/json'}};
  if (token) opt.headers.Authorization = token;
  if (body) opt.body = JSON.stringify(body);
  return fetch('/api' + path, opt).then(function(r){ return r.json(); }).catch(function(){ return {code:600, message:'网络错误'}; })
    .then(function(j){
      if (j.code === 401 && auth && !retry) return doLogin(auth.u, auth.p, true).then(function(){ return api(path, body, true); });
      return j;
    });
}
/* 带登录态的 GET（用于 /stream/*、/ls/*），401 自动续期后重试一次 */
function authGet(url, retry){
  return fetch(url, {headers: token ? {Authorization: token} : {}}).then(function(r){
    if (r.status === 401 && auth && !retry) {
      return doLogin(auth.u, auth.p, true).then(function(){ return authGet(url, true); });
    }
    return r.json().then(function(j){
      if (j && j.code === 401 && auth && !retry) {
        return doLogin(auth.u, auth.p, true).then(function(){ return authGet(url, true); });
      }
      return j;
    });
  });
}
function doLogin(u, p, silent){
  return fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p})})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j.code !== 200) throw new Error(j.message || '登录失败');
      token = j.data.token;
      localStorage.setItem('yun_token', token);
      auth = {u:u, p:p};
      localStorage.setItem('yun_auth', JSON.stringify(auth));
      return j;
    });
}

/* ===== 视图 ===== */
function show(login){ document.getElementById('login-view').classList.toggle('hidden', !login); document.getElementById('app-view').classList.toggle('hidden', login); }

/* ===== 登录 ===== */
function loginClick(){
  var u = document.getElementById('in-user').value.trim() || 'admin';
  var p = document.getElementById('in-pass').value;
  doLogin(u, p).then(function(){ document.getElementById('login-err').textContent=''; enterApp(); })
    .catch(function(e){ document.getElementById('login-err').textContent='登录失败：'+(e.message||'密码错误'); });
}
function enterApp(){
  show(false);
  document.getElementById('userbar').innerHTML = esc(auth.u)+' · <a href="#" id="lnk-logout" style="color:#7c8dab">退出</a>';
  document.getElementById('lnk-logout').onclick = function(){ localStorage.removeItem('yun_token'); localStorage.removeItem('yun_auth'); location.reload(); return false; };
  healStorage();
  loadSrvCfg();
  refreshTasks(); refreshFiles(); renderHistory();
}

/* 读服务端播放/清理配置（保留时长、转码上限等） */
function loadSrvCfg(){
  authGet('/stream/health').then(function(j){
    if (!j || j.retention_hours == null) return;
    srvCfg = j;
    if (j.ffmpeg === '不可用') toast('转码服务里的 ffmpeg 不可用，只能播浏览器原生支持的格式');
    if (j.disk && j.disk.used_percent >= 90) toast('磁盘已用 '+j.disk.used_percent+'%，旧文件会被优先清理');
  }).catch(function(){ /* 转码服务没起来时不打扰用户，播放时自然会报错 */ });
}

/* ===== 添加下载 ===== */
function addDownload(){
  var el = document.getElementById('in-magnet');
  var url = el.value.trim();
  if (!url) { toast('请先粘贴链接'); return; }
  api('/fs/add_offline_download', {urls:[url], path:DL, tool:'aria2', delete_policy:'delete_never'}).then(function(j){
    if (j.code === 200) { el.value=''; toast('已添加，开始下载'); taskFiles={}; refreshTasks(); }
    else toast('添加失败：'+(j.message||'链接不合法'));
  });
}

/* ===== 任务列表 ===== */
var lastRaw = [];
function refreshTasks(){
  // 也要看「转存」任务：aria2 是先下到 AList 临时目录，再由转存任务搬进 downloads/。
  // 只看下载任务的话，卡在转存这一步会完全看不出来。
  Promise.all([
    api('/admin/task/offline_download/undone'),
    api('/admin/task/offline_download/done'),
    api('/admin/task/offline_download_transfer/undone'),
    api('/admin/task/offline_download_transfer/done')
  ]).then(function(rs){
    var mk = function(list, stage, kind){
      return (list||[]).map(function(t){ t._stage=stage; t._kind=kind; return t; });
    };
    var dl = mk(rs[0].data, '下载', 'dl').concat(mk(rs[1].data, '已完成', 'dl'));
    var tr = mk(rs[2].data, '转存中', 'tr').concat(mk(rs[3].data, '转存完成', 'tr'));
    var tasks = dl.concat(tr);
    lastRaw = tasks;
    tasks.forEach(function(t){ taskMap[t.id] = t; });
    // 自动扫描：无文件缓存的任务立即扫；未完成的任务每 15 秒重扫（发现新视频）
    dl.forEach(function(t){
      if (!taskFiles[t.id] || (!taskFiles[t.id].length && Date.now()-(scanTs[t.id]||0) > 15000)) assignFiles(t.id);
      else if (t._stage !== '已完成' && Date.now()-(scanTs[t.id]||0) > 15000) assignFiles(t.id);
    });
    renderTasks();
  });
}

/* 任务名可能就是一整条磁力链接。把 dn= 里的真实名字抠出来：
   既好看，也让下面「任务名 ↔ 文件夹名」的匹配真的能匹配上 */
function taskName(t){
  var n = (t.name||'').replace(/^download\s+/i,'').replace(/\s+to\s+\(.*?\)\s*$/,'').trim();
  var m = n.match(/[?&]dn=([^&\s]+)/i);
  if (m) {
    try { return decodeURIComponent(m[1].replace(/\+/g,' ')); } catch(e){ return m[1]; }
  }
  if (/^magnet:/i.test(n)) {
    var h = n.match(/btih:([0-9a-z]+)/i);
    return h ? '磁力 ' + h[1].slice(0,16) + '…' : n;
  }
  return n;
}

function renderTasks(){
  var box = document.getElementById('task-list');
  if (!lastRaw.length) { box.innerHTML='<div class="empty">暂无下载任务，粘贴链接开始</div>'; return; }
  var h = '';
  lastRaw.forEach(function(t){
    var prog = Math.round(+t.progress || 0);
    var isTr = t._kind === 'tr';
    var done = t._stage === '已完成' || t._stage === '转存完成';
    var name = taskName(t);
    var hasFiles = taskFiles[t.id] && taskFiles[t.id].length;
    var openState = hasFiles && taskFiles[t.id]._open;
    h += '<div class="task" data-tid="'+esc(t.id)+'">'
      + '<div class="task-head">'
      + '<div class="ico">'+(t.error?'❌':(done?'✅':(isTr?'📦':'⬇️')))+'</div>'
      + '<div class="name" title="'+esc(name)+'">'+(isTr?'<span class="stage">转存</span>':'')+esc(name)+'</div>'
      + '<div class="bar-wrap"><div class="bar"><i style="width:'+prog+'%"></i></div></div>'
      + '<div class="pct">'+(done?'100%':prog+'%')+'</div>'
      + '<div class="acts">';
    if (!isTr) {
      h += '<button class="folder-btn'+(openState?' open':'')+'" data-folder="'+esc(t.id)+'">'+(openState?'收起':'展开文件')+'</button>';
      h += '<button class="del-btn" data-deltask="'+esc(t.id)+'" title="删除该任务及文件">🗑</button>';
    }
    h += '</div></div>';
    // 把 AList 的报错原文摊开：卡住时这行往往就是唯一有用的线索
    if (t.error) h += '<div class="task-err">'+esc(String(t.error))+'</div>';
    else if (!isTr && done && !hasFiles) h += '<div class="task-err warn">下载已完成，但 downloads/ 里没扫到视频文件。'
      + '常见原因：BT 还在做种导致转存没触发（上面若无「转存」任务即是），或文件已被到期清理。</div>';
    if (hasFiles && taskFiles[t.id]._open) {
      h += '<div class="task-files">';
      taskFiles[t.id].forEach(function(f){
        var playing = currentPlayPath === f.path;
        h += '<div class="file-row">'
          + '<div class="fname">'+esc(f.name)+(playing?'<span class="now-playing">▶ 播放中</span>':'')+'</div>'
          + '<div class="fsize">'+fmtSize(f.size)+'</div>'
          + '<div class="fstatus">'+(done?'':'下载中 ')+remainText(f)+'</div>'
          + '<button class="play-btn" data-play="'+esc(f.path)+'">▶ 播放</button>'
          + '<button class="del-btn" data-del="'+esc(f.path)+'" title="删除文件">🗑</button>'
          + '</div>';
      });
      h += '</div>';
    }
    h += '</div>';
  });
  box.innerHTML = h;
  // bind events
  box.querySelectorAll('[data-folder]').forEach(function(b){ b.onclick=function(){ toggleFolder(b.getAttribute('data-folder')); }; });
  box.querySelectorAll('[data-play]').forEach(function(b){ b.onclick=function(){ play(b.getAttribute('data-play')); }; });
  box.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ delFile(b.getAttribute('data-del')); }; });
  box.querySelectorAll('[data-deltask]').forEach(function(b){ b.onclick=function(){ delTask(b.getAttribute('data-deltask')); }; });
}

/* ===== 删除 ===== */
function delFile(path){
  var name = path.split('/').pop();
  if (!confirm('删除文件「'+name+'」？\n（播放记录会保留）')) return;
  var dir = path.slice(0, path.length - name.length - 1) || DL;
  api('/fs/remove', {dir:dir, names:[name]}).then(function(j){
    delete knownVideos[path];
    scanCache = null;
    toast(j.code===200?'已删除':'删除失败：'+(j.message||''));
    refreshTasks(); renderFileList();
  });
}
function delTask(tid){
  var t = taskMap[tid] || {};
  var tname = taskName(t);
  if (!confirm('删除「'+tname+'」的任务及文件？\n（播放记录会保留）')) return;
  api('/fs/list', {path:DL, page:1, per_page:200, refresh:true}).then(function(j){
    var items = (j.code===200 && j.data && j.data.content) ? j.data.content : [];
    var dirs = items.filter(function(f){ return f.is_dir; });
    var single = items.find(function(f){ return !f.is_dir && f.name===tname; });
    var targetDir = dirs.find(function(d){ return d.name.toLowerCase().indexOf(tname.toLowerCase())>-1 || tname.toLowerCase().indexOf(d.name.toLowerCase())>-1; });
    if (!targetDir && dirs.length===1 && !single) targetDir = dirs[0];
    var del = single ? {dir:DL, names:[tname]} : (targetDir ? {dir:DL, names:[targetDir.name]} : null);
    var finish = function(){
      api('/admin/task/offline_download/delete?tid='+encodeURIComponent(tid), {});
      api('/admin/task/offline_download_transfer/delete?tid='+encodeURIComponent(tid), {});
      delete taskFiles[tid];
      scanCache = null;
      toast('已删除');
      refreshTasks(); renderFileList();
    };
    if (del) api('/fs/remove', del).then(finish); else finish();
  });
}

/* ===== 目录列表（nginx 直接读磁盘，无需 AList 存储，下载中即可见） ===== */
function lsDir(path){
  return authGet('/ls' + path.split('/').map(encodeURIComponent).join('/') + '/')
    .then(function(arr){
      if (!Array.isArray(arr)) return null;   // 401 / 目录不存在时按「读不到」处理
      return arr.map(function(e){
        var n = e.name; try { n = decodeURIComponent(n); } catch(err){}
        return {name:n, is_dir:e.type==='directory', size:+e.size||0, modified:e.mtime};
      });
    }).catch(function(){ return null; });
}

/* ===== 自动修复 AList 的 /downloads 存储挂载（删除文件需要它） ===== */
var healed = false;
function healStorage(){
  if (healed) return;
  api('/fs/list', {path:DL, page:1, per_page:5, refresh:false}).then(function(j){
    if (j.code === 200) { healed = true; return; }
    api('/admin/storage/create', {mount_path:'/downloads', driver:'Local', addition:'{"root_folder_path":"/root/Download"}'}).then(function(j2){
      if (j2.code === 200) { healed = true; toast('已自动修复下载目录挂载'); }
    });
  });
}

/* ===== 展开/扫描文件 ===== */
var scanTs = {};   // tid -> last scan time (throttle)
// 多个任务会同时要求扫目录，3 秒内合并成一次，别把请求打散
var scanCache = null, scanCacheTs = 0, scanWaiters = null;
function collectVideos(cb){
  if (scanCache && Date.now() - scanCacheTs < 3000) return cb(scanCache);
  if (scanWaiters) { scanWaiters.push(cb); return; }
  scanWaiters = [cb];
  var done = function(res){
    if (res) { scanCache = res; scanCacheTs = Date.now(); }
    var ws = scanWaiters; scanWaiters = null;
    ws.forEach(function(w){ w(res); });
  };
  scanOnce(done);
}
function scanOnce(cb){
  lsDir(DL).then(function(items){
    if (!items) return cb(null);
    var dirs = items.filter(function(f){ return f.is_dir; });
    var rootVids = items.filter(function(f){ return !f.is_dir && VIDEO_RE.test(f.name); })
      .map(function(f){ return {name:f.name, path:DL+'/'+f.name, size:f.size, modified:f.modified}; });
    if (!dirs.length) return cb({root:rootVids, dirs:{}});
    var pending = dirs.length, dirMap = {};
    dirs.forEach(function(d){
      lsDir(DL+'/'+d.name).then(function(sub){
        dirMap[d.name] = (sub||[]).filter(function(f){ return !f.is_dir && VIDEO_RE.test(f.name); })
          .map(function(f){ return {name:f.name, path:DL+'/'+d.name+'/'+f.name, size:f.size, modified:f.modified}; });
        if (--pending === 0) cb({root:rootVids, dirs:dirMap});
      });
    });
  });
}
function assignFiles(tid){
  scanTs[tid] = Date.now();
  var tname = taskName(taskMap[tid] || {});
  collectVideos(function(res){
    if (!res) return;
    var files = null;
    // 1. 子目录名与任务名匹配
    Object.keys(res.dirs).forEach(function(dn){
      if (files && files.length) return;
      var a = dn.toLowerCase(), b = tname.toLowerCase();
      if ((b && (a.indexOf(b)>-1 || b.indexOf(a)>-1)) && res.dirs[dn].length) files = res.dirs[dn];
    });
    // 2. 任务名本身就是根目录下的视频文件
    if (!files || !files.length) {
      var m = res.root.filter(function(f){ return f.name === tname; });
      if (m.length) files = m;
    }
    // 3. 只有一个含视频的子目录 → 就是它
    if (!files || !files.length) {
      var dv = Object.keys(res.dirs).filter(function(dn){ return res.dirs[dn].length; });
      if (dv.length === 1) files = res.dirs[dv[0]];
    }
    // 4. 兜底：根目录视频，否则列出全部视频
    if (!files || !files.length) files = res.root.length ? res.root : Object.keys(res.dirs).reduce(function(acc,dn){ return acc.concat(res.dirs[dn]); }, []);
    if (!files || !files.length) return; // 还没有视频出现，下次刷新再试
    var wasOpen = taskFiles[tid] ? taskFiles[tid]._open : true;
    taskFiles[tid] = files;
    taskFiles[tid]._open = wasOpen;
    renderTasks();
    renderFileList();
  });
}
function toggleFolder(tid){
  if (taskFiles[tid] && taskFiles[tid]._open) { taskFiles[tid]._open = false; renderTasks(); return; }
  if (taskFiles[tid] && taskFiles[tid].length) { taskFiles[tid]._open = true; renderTasks(); return; }
  assignFiles(tid);
}

/* ===== 已完成文件列表（底部） ===== */
function refreshFiles(){
  lsDir(DL).then(function(items){
    if (!items) return;
    var rootFiles = items.filter(function(f){ return !f.is_dir && VIDEO_RE.test(f.name); });
    // auto-play check
    rootFiles.forEach(function(f){ var p=DL+'/'+f.name; if(!knownVideos[p]){knownVideos[p]=1; checkAutoPlay(p);} });
  });
}

/* 「全部视频文件」：按文件夹分组列出下载目录里的每一个视频，每行都有播放按钮。
   任务分组靠的是名称匹配，多个种子同时下载时可能认错；这里是不依赖任务的兜底入口，
   多文件种子里的任何一集都保证能在这儿找到并播放。 */
function renderFileList(){
  var existing = document.getElementById('file-section');
  if (existing) existing.remove();
  collectVideos(function(res){
    if (!res) {
      // 目录列表读不到（转码服务没起来 / 登录态失效）。以前这里静默留白，
      // 看起来就像「没有文件」，很误导人，所以必须明说
      var w = document.createElement('div');
      w.id = 'file-section';
      w.className = 'banner';
      w.textContent = '读不到下载目录。目录列表需要转码服务(caster)鉴权，'
        + '请在服务器上执行 bash menu.sh status 看 yun-caster 是否在运行。';
      document.getElementById('tasks-view').appendChild(w);
      return;
    }
    var groups = [];
    Object.keys(res.dirs).sort().forEach(function(dn){
      if (res.dirs[dn].length) groups.push({title:'📁 '+dn, files:res.dirs[dn]});
    });
    if (res.root.length) groups.push({title:'独立视频文件', files:res.root});
    if (!groups.length) return;

    var total = groups.reduce(function(n,g){ return n + g.files.length; }, 0);
    var sec = document.createElement('div');
    sec.id = 'file-section';
    sec.style.cssText = 'margin-top:18px';
    var h = '<h3 style="font-size:13px;color:#7c8dab;margin-bottom:8px;font-weight:600">'
          + '全部视频文件（' + total + '）</h3>';
    groups.forEach(function(g){
      h += '<div style="font-size:12px;color:#5a6b8c;margin:10px 0 2px">'+esc(g.title)+'</div>';
      g.files.forEach(function(f){
        var playing = currentPlayPath === f.path;
        h += '<div class="file-row">'
          + '<div class="fname">'+esc(f.name)+(playing?'<span class="now-playing">▶ 播放中</span>':'')+'</div>'
          + '<div class="fsize">'+fmtSize(f.size)+'</div>'
          + '<div class="fstatus">'+remainText(f)+'</div>'
          + '<button class="play-btn" data-play="'+esc(f.path)+'">▶ 播放</button>'
          + '<button class="del-btn" data-del="'+esc(f.path)+'" title="删除文件">🗑</button>'
          + '</div>';
      });
    });
    sec.innerHTML = h;
    document.getElementById('tasks-view').appendChild(sec);
    sec.querySelectorAll('[data-play]').forEach(function(b){ b.onclick=function(){ play(b.getAttribute('data-play')); }; });
    sec.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ delFile(b.getAttribute('data-del')); }; });
  });
}

function checkAutoPlay(path){
  if (!document.getElementById('chk-auto').checked) return;
  var hc = hist[path];
  if (hc && hc.pos > 10) return; // already watched, don't auto-play
  toast('新文件可播放');
  play(path, 0);
}

/* ===== 播放 =====
   先问 /stream/probe：原文件浏览器能直接吃就直连（零 CPU、可拖动、可边下边播），
   否则走服务端按需转码的 HLS（H.265 / AC3 / DTS / MKV 全部能播，同时省 VPS 流量）。 */
var video = document.getElementById('video');
var hls = null;          // hls.js 实例
var cur = null;          // 当前文件的 probe 结果
var playMode = 'direct', playHeight = 0, playAudio = null;
var hlsJsLoading = null;
var playSeq = 0;                 // 快速连点/切换清晰度时，丢弃过期的回调
var directFallbackTried = {};    // 每个文件最多自动降级一次，避免来回打转

function setLoading(text){
  document.getElementById('player-tip').classList.add('hidden');
  video.classList.add('hidden');
  document.getElementById('player-loading').classList.remove('hidden');
  document.getElementById('loading-text').textContent = text || '正在准备…';
}
function showVideo(){
  document.getElementById('player-loading').classList.add('hidden');
  document.getElementById('player-tip').classList.add('hidden');
  video.classList.remove('hidden');
}
function showIdle(msg){
  document.getElementById('player-loading').classList.add('hidden');
  video.classList.add('hidden');
  var tip = document.getElementById('player-tip');
  if (msg) tip.innerHTML = '<div class="big">😕</div><div>'+esc(msg)+'</div>';
  tip.classList.remove('hidden');
}
function destroyHls(){ if (hls){ try { hls.destroy(); } catch(e){} hls = null; } }

/* hls.js：优先用镜像内置的本地副本，拉不到再退到公网 CDN */
function loadHlsJs(){
  if (window.Hls) return Promise.resolve();
  if (hlsJsLoading) return hlsJsLoading;
  var urls = ['/stream/hls.js',
              'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js',
              'https://unpkg.com/hls.js@1/dist/hls.min.js'];
  hlsJsLoading = urls.reduce(function(chain, u){
    return chain.catch(function(){
      return new Promise(function(res, rej){
        var s = document.createElement('script');
        s.src = u;
        s.onload = function(){ window.Hls ? res() : rej(new Error('bad script')); };
        s.onerror = function(){ rej(new Error('load fail')); };
        document.head.appendChild(s);
      });
    });
  }, Promise.reject(new Error('start'))).catch(function(e){ hlsJsLoading = null; throw e; });
  return hlsJsLoading;
}

function play(path, resume){
  currentPlayPath = path;
  renderTasks();
  destroyHls();
  document.getElementById('pbar').classList.add('hidden');
  setLoading('正在探测视频信息…');
  video.scrollIntoView({behavior:'smooth', block:'start'});
  authGet('/stream/probe?p=' + encodeURIComponent(path)).then(function(j){
    if (!j || j.code !== 200 || !j.data) throw new Error((j && j.message) || '探测失败');
    cur = j.data;
    buildPbar();
    var pos = resume;
    if (pos == null) {
      var hc = hist[path];
      pos = (hc && hc.pos > 10 && (!hc.dur || hc.pos < hc.dur*0.95)) ? hc.pos : 0;
    }
    return start(cur.mode, cur.default_height, cur.default_audio, pos);
  }).catch(function(e){
    showIdle('无法播放：' + (e.message || e));
    toast('无法播放：' + (e.message || e));
  });
}

function hlsUrl(height, audioIdx){
  var u = '/stream/hls/index.m3u8?p=' + encodeURIComponent(cur.path)
        + '&h=' + height + '&pt=' + encodeURIComponent(cur.ticket);
  if (audioIdx != null) u += '&a=' + audioIdx;
  return u;
}

function start(mode, height, audioIdx, pos){
  playMode = mode; playHeight = height; playAudio = audioIdx;
  destroyHls();
  applySubs();
  updateBadge();
  var seekTo = pos || 0;
  var seq = ++playSeq;
  video.addEventListener('loadedmetadata', function(){
    if (seq !== playSeq) return;   // 已经切到别的源了，别把进度拨回去
    if (seekTo > 0) { try { video.currentTime = seekTo; } catch(e){} }
    applySubChoice();
  }, {once:true});

  if (mode === 'direct') {
    setLoading('正在加载原文件…');
    video.src = cur.direct_url;
    showVideo();
    video.play().catch(function(){});
    return Promise.resolve();
  }

  setLoading('正在转码，首次开播要等几秒…');
  var url = hlsUrl(height, audioIdx);
  if (video.canPlayType('application/vnd.apple.mpegurl')) {   // Safari 原生吃 HLS
    video.src = url;
    showVideo();
    video.play().catch(function(){});
    return Promise.resolve();
  }
  return loadHlsJs().then(function(){
    if (!Hls.isSupported()) throw new Error('浏览器不支持 MSE');
    hls = new Hls({
      maxBufferLength: 30, maxMaxBufferLength: 60,
      manifestLoadingTimeOut: 60000,
      fragLoadingTimeOut: 300000,      // 单片转码在弱 VPS 上可能要几十秒
      fragLoadingMaxRetry: 4
    });
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ showVideo(); video.play().catch(function(){}); });
    hls.on(Hls.Events.ERROR, function(_e, data){
      if (!data || !data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { try { hls.recoverMediaError(); return; } catch(e){} }
      var code = data.response && data.response.code;
      if (code === 401) {   // 票据过期：重新探测换张新票据，无感续播
        toast('播放票据过期，正在重新获取…');
        play(cur.path, video.currentTime || 0);
        return;
      }
      toast(code === 409 ? '视频还没下载到足够数据，等一会儿再播'
                         : '转码播放失败：' + (data.details || '未知错误') + '（可试试更低清晰度）');
    });
    hls.loadSource(url);
    hls.attachMedia(video);
  }).catch(function(){
    toast('hls.js 加载失败，改用原画直连（可能不兼容）');
    video.src = cur.direct_url;
    showVideo();
    video.play().catch(function(){});
  });
}

/* ===== 播放器控制条：清晰度 / 音轨 / 字幕 ===== */
function updateBadge(){
  var b = document.getElementById('mode-badge');
  b.className = 'badge ' + (playMode === 'direct' ? 'direct' : 'hls');
  b.textContent = playMode === 'direct' ? '原画直连' : ('转码 ' + playHeight + 'p');
  document.getElementById('mode-note').textContent = cur ? cur.reason : '';
}

function buildPbar(){
  document.getElementById('pbar').classList.remove('hidden');

  var sq = document.getElementById('sel-quality');
  var opts = [{v:'direct', t: cur.mode === 'direct' ? '原画直连（推荐）' : '原画直连（可能不兼容）'}];
  (cur.heights || []).slice().sort(function(a,b){ return b-a; }).forEach(function(h){
    opts.push({v:'h'+h, t:'转码 '+h+'p'});
  });
  sq.innerHTML = opts.map(function(o){ return '<option value="'+o.v+'">'+esc(o.t)+'</option>'; }).join('');
  sq.value = cur.mode === 'direct' ? 'direct' : ('h' + cur.default_height);
  document.getElementById('wrap-quality').classList.remove('hidden');
  sq.onchange = function(){
    var pos = video.currentTime || 0;
    if (sq.value === 'direct') start('direct', playHeight, playAudio, pos);
    else start('hls', parseInt(sq.value.slice(1), 10), playAudio, pos);
  };

  var sa = document.getElementById('sel-audio');
  var wa = document.getElementById('wrap-audio');
  if ((cur.audios || []).length > 1) {
    sa.innerHTML = cur.audios.map(function(a){
      return '<option value="'+a.index+'">'+esc(a.label)+'</option>';
    }).join('');
    sa.value = String(cur.default_audio);
    wa.classList.remove('hidden');
    sa.onchange = function(){
      var pos = video.currentTime || 0;
      // 直连模式下浏览器只认第一条音轨，切音轨必须转码
      start('hls', playMode === 'direct' ? cur.default_height : playHeight,
            parseInt(sa.value, 10), pos);
      document.getElementById('sel-quality').value = 'h' + playHeight;
    };
  } else {
    wa.classList.add('hidden');
  }

  var ss = document.getElementById('sel-sub');
  var ws = document.getElementById('wrap-sub');
  if ((cur.subs || []).length) {
    ss.innerHTML = '<option value="-1">关闭</option>' + cur.subs.map(function(s, i){
      return '<option value="'+i+'">'+esc(s.label)+'</option>';
    }).join('');
    // 有中文字幕就默认打开
    var zh = -1;
    cur.subs.forEach(function(s, i){
      if (zh < 0 && /chi|zho|zh|chs|cht|简|繁|中/i.test((s.lang||'') + ' ' + (s.label||''))) zh = i;
    });
    ss.value = String(zh);
    ws.classList.remove('hidden');
    ss.onchange = applySubChoice;
  } else {
    ws.classList.add('hidden');
  }
}

function applySubs(){
  Array.prototype.slice.call(video.querySelectorAll('track')).forEach(function(t){ t.remove(); });
  (cur.subs || []).forEach(function(s, i){
    var t = document.createElement('track');
    t.kind = 'subtitles';
    t.label = s.label || ('字幕' + (i+1));
    t.srclang = (s.lang || 'zh').slice(0, 8);
    t.src = s.url;
    video.appendChild(t);
  });
}
function applySubChoice(){
  var want = parseInt(document.getElementById('sel-sub').value, 10);
  var tt = video.textTracks;
  for (var i = 0; i < tt.length; i++) tt[i].mode = (i === want) ? 'showing' : 'disabled';
}
video.addEventListener('timeupdate', function(){
  var p = currentPlayPath; if (!p) return;
  if (!hist[p]) hist[p] = {pos:0, dur:0, ts:0};
  hist[p].pos = video.currentTime; hist[p].dur = video.duration || hist[p].dur; hist[p].ts = Date.now();
  saveHistSoon();
});
video.addEventListener('ended', function(){ var p=currentPlayPath; if(p&&hist[p]){ hist[p].pos=hist[p].dur||hist[p].pos; saveHist(); } });
video.addEventListener('error', function(){
  if (!video.error) return;              // 切源过程中的伪 error 不处理
  var p = currentPlayPath;
  if (playMode === 'direct' && cur && p && !directFallbackTried[p]) {
    // 直连播不动就自动降级去转码，用户不用自己琢磨格式问题；每个文件只自动降一次
    directFallbackTried[p] = 1;
    toast('原文件浏览器播不了，正在切换到转码播放…');
    document.getElementById('sel-quality').value = 'h' + cur.default_height;
    start('hls', cur.default_height, playAudio, video.currentTime || 0);
    return;
  }
  toast('视频加载失败：可能还没下载到足够数据、已被自动清理，或转码进程异常（可看 bash menu.sh logs）');
});
window.addEventListener('beforeunload', saveHist);
var saveTimer;
function saveHistSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveHist, 4000); }
function saveHist(){ localStorage.setItem('yun_hist', JSON.stringify(hist)); }

/* ===== 播放记录 ===== */
function renderHistory(){
  var box = document.getElementById('history-list');
  var list = Object.keys(hist).map(function(p){ return Object.assign({path:p}, hist[p]); })
    .filter(function(h){ return h.ts; }).sort(function(a,b){ return b.ts-a.ts; });
  if (!list.length) { box.innerHTML='<div class="empty">暂无播放记录</div>'; return; }
  var h = '';
  list.forEach(function(it){
    var pct = it.dur ? Math.min(100, Math.round(it.pos/it.dur*100)) : 0;
    var name = it.path.split('/').pop();
    h += '<div class="task"><div class="task-head">'
      + '<div class="ico">'+(pct>=95?'✅':'⏱️')+'</div>'
      + '<div class="name" data-hplay="'+esc(it.path)+'">'+esc(name)+'</div>'
      + '<div class="bar-wrap"><div class="bar"><i style="width:'+pct+'%"></i></div></div>'
      + '<div class="fsize">'+fmtDate(it.ts)+'<br>'+fmtTime(it.pos)+'/'+fmtTime(it.dur)+'</div>'
      + '<div class="acts"><button class="play-btn" data-hplay="'+esc(it.path)+'">'+(pct>=95?'重播':'继续')+'</button>'
      + '<button class="mini" data-hrm="'+esc(it.path)+'">删除</button></div>'
      + '</div></div>';
  });
  box.innerHTML = h;
  box.querySelectorAll('[data-hplay]').forEach(function(n){ n.onclick=function(){ play(n.getAttribute('data-hplay')); switchTab('tasks'); }; });
  box.querySelectorAll('[data-hrm]').forEach(function(n){ n.onclick=function(){ delete hist[n.getAttribute('data-hrm')]; saveHist(); renderHistory(); }; });
}

/* ===== 标签页 ===== */
function switchTab(name){
  document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===name); });
  document.getElementById('tasks-view').classList.toggle('hidden', name!=='tasks');
  document.getElementById('history-view').classList.toggle('hidden', name!=='history');
}
document.querySelectorAll('.tabs button').forEach(function(b){ b.onclick=function(){ switchTab(b.dataset.tab); if(b.dataset.tab==='history') renderHistory(); }; });

/* ===== 启动 ===== */
document.getElementById('btn-login').onclick = loginClick;
document.getElementById('in-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') loginClick(); });
document.getElementById('btn-add').onclick = addDownload;
document.getElementById('in-magnet').addEventListener('keydown', function(e){ if(e.key==='Enter') addDownload(); });
var chkAuto = document.getElementById('chk-auto');
if (localStorage.getItem('yun_autoplay') === '0') chkAuto.checked = false;
chkAuto.onchange = function(){ localStorage.setItem('yun_autoplay', chkAuto.checked ? '1' : '0'); };

(function boot(){
  if (token && auth) {
    api('/me').then(function(j){
      if (j.code === 200) enterApp();
      else if (auth) doLogin(auth.u, auth.p, true).then(enterApp).catch(function(){ show(true); });
      else show(true);
    });
  } else show(true);
})();

// 过期清理已由服务端 caster 常驻执行（关掉网页也照样生效），前端不再参与删除

// 定时刷新下载进度 + 文件列表
setInterval(function(){
  if (token && !document.hidden && !document.getElementById('app-view').classList.contains('hidden')) {
    refreshTasks();
    refreshFiles();
  }
}, 5000);

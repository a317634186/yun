upstream yun_alist {
    server alist:5244;
    keepalive 16;
}

upstream yun_caster {
    server caster:8000;
    keepalive 8;              # caster 是 Python 线程模型，长连接数不宜太多
}

server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    # 播放器首页
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # AList 接口（登录、离线下载、文件删除）
    location /api/ {
        proxy_pass http://yun_alist;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # ============ 播放服务（caster）============
    # /stream/probe  探测 + 下发播放地址
    # /stream/hls/*  按需转码的 HLS 播放列表与分片
    # /stream/sub    字幕转 WebVTT
    # /stream/hls.js 镜像内置的 hls.js
    location /stream/ {
        proxy_pass http://yun_caster/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;                 # 分片边生成边下发
        proxy_read_timeout 300s;             # 弱鸡 VPS 上单片转码可能要几十秒
        proxy_send_timeout 300s;
    }

    # 鉴权子请求（仅内部使用，外部访问不到）
    location = /_auth/play {
        internal;
        proxy_pass http://yun_caster/auth/play;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }
    location = /_auth/api {
        internal;
        proxy_pass http://yun_caster/auth/api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    # 视频直链（原画直连）：nginx 直接读磁盘，天然支持 Range（拖进度条、边下边播）。
    # 必须带 /stream/probe 下发的播放票据 pt，否则 401 —— 不再是公开可下载的目录。
    location /d/downloads/ {
        auth_request /_auth/play;
        alias /srv/downloads/;
        types {
            video/mp4 mp4 m4v;
            video/webm webm;
            video/ogg ogm ogv;
            video/x-matroska mkv;
            video/avi avi;
            video/mpeg mpg mpeg;
            video/quicktime mov;
            video/x-flv flv;
            video/mp2t ts m2ts;
        }
        default_type application/octet-stream;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-store";
    }

    # 目录列表 JSON：前端扫描视频文件用，需要 AList 登录态
    location /ls/downloads/ {
        auth_request /_auth/api;
        alias /srv/downloads/;
        autoindex on;
        autoindex_format json;
        types { }
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # 预览图 / 图标
    location /p/ {
        proxy_pass http://yun_alist;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
    location /i/ {
        proxy_pass http://yun_alist;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # 其余路径转给 AList（/@login 可进原版后台挂网盘用）
    location / {
        proxy_pass http://yun_alist;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}

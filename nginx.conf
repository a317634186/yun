server {
    listen 80;
    server_name _;
    client_max_body_size 200m;

    # 播放器首页
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # AList 接口（登录、离线下载、文件列表）
    location /api/ {
        proxy_pass http://alist:5244;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # 视频直链：直接读磁盘，天然支持 Range（边下边播、拖动进度条），无需鉴权
    location /d/downloads/ {
        alias /srv/downloads/;
        types {
            video/mp4 mp4 m4v;
            video/webm webm;
            video/ogg ogm ogv;
            video/x-matroska mkv;
            video/avi avi;
            video/mpeg mpg mpeg;
            video/quicktime mov;
            video/x-flv flv;
            video/mp2t ts m2ts;
        }
        default_type application/octet-stream;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "no-store";
    }

    # 目录列表 JSON：前端扫描视频文件用（无需登录、不依赖 AList 存储）
    location /ls/downloads/ {
        alias /srv/downloads/;
        autoindex on;
        autoindex_format json;
        types { }
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # 预览图 / 图标
    location /p/ {
        proxy_pass http://alist:5244;
        proxy_set_header Host $host;
    }
    location /i/ {
        proxy_pass http://alist:5244;
        proxy_set_header Host $host;
    }

    # 其余路径转给 AList（/​@login 可进原版后台挂网盘用）
    location / {
        proxy_pass http://alist:5244;
        proxy_set_header Host $host;
    }
}
